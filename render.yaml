services:
  - type: web
    name: jules-autonomous-agent
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: PORT
        value: 10000
    autoDeploy: true
